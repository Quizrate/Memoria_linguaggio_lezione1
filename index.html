<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz di classe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* VOICE: allegro ma da aula, chiaro per chi gioca da telefono.
   IDEA: il tabellone di un quiz a squadre: cartellini, punteggi, una striscia gialla.
   PICTURE: lo strumento stesso: domande grandi, risposte a cartellino, classifica a righe.
   COLOUR and TYPE: giallo sole, inchiostro quasi nero, corallo per l'azione; Rubik.
   LAYOUT: striscia gialla in alto, colonna centrale 880px, schede impilate. */
:root{color-scheme:light dark;
--bg:light-dark(#fffaf0,#14130f);--ink:light-dark(#1b1a17,#f4efe2);--card:light-dark(#ffffff,#1f1d18);
--line:light-dark(#e6dcc6,#37332b);--muted:light-dark(#6b665a,#aaa391);--soft:light-dark(#fff3cc,#2a2619);
--sun:#ffcf33;--sunink:#1b1a17;--coral:light-dark(#e8471f,#ff6a45);
--ok:light-dark(#12806b,#41c9a9);--okbg:light-dark(#dff4ee,#123029);--ko:light-dark(#c8381a,#ff7f62);--kobg:light-dark(#fde5de,#3a1d15)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Rubik,system-ui,sans-serif;overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5vw,44px);font-weight:800}
h2{font-size:clamp(22px,3.4vw,28px);font-weight:700}
h3{font-size:18px;font-weight:700}
.top{background:var(--sun);color:var(--sunink);border-bottom:3px solid var(--sunink)}
.top-in{max-width:880px;margin:0 auto;padding:12px max(4vw,16px);display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{font-weight:800;font-size:20px;text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{background:transparent;border:2px solid var(--sunink);color:var(--sunink);border-radius:999px;padding:6px 14px;min-height:40px;font-weight:500;cursor:pointer}
nav button.on{background:var(--sunink);color:var(--sun)}
main{max-width:880px;margin:0 auto;padding:clamp(20px,4vw,40px) max(4vw,16px) 64px}
.lead{color:var(--muted);max-width:62ch;margin:8px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack-s>*+*{margin-top:12px}
.btn{min-height:44px;padding:8px 16px;border-radius:12px;border:2px solid var(--ink);background:var(--card);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.9}
.btn.accent{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn.small{min-height:36px;padding:4px 10px;font-size:14px;border-radius:9px}
.btn.danger{border-color:var(--ko);color:var(--ko)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;margin-bottom:24px}
.grid{display:grid;gap:14px}
.qcard h3{font-size:20px}
.meta{color:var(--muted);font-size:14px;margin:4px 0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:13px;border-radius:999px;padding:2px 10px;background:var(--soft);border:1px solid var(--line)}
.linkrow{display:flex;gap:8px;margin-top:12px}
.linkrow input{flex:1;font-size:14px;border:2px dashed var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);min-height:40px}
.note{font-size:14px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 14px;margin:0 0 20px}
.empty{text-align:center;padding:40px 16px;border:2px dashed var(--line);border-radius:18px;color:var(--muted)}
/* editor */
.fld{display:block;margin:14px 0}
.fld>span{display:block;font-weight:500;margin-bottom:6px;font-size:15px}
input[type=text],textarea,.fld input{width:100%;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);min-height:44px}
textarea{resize:vertical}
.chk{display:flex;gap:10px;align-items:center;margin:8px 0 20px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--coral)}
.qe{margin:16px 0;border-left:6px solid var(--sun)}
.tag{font-size:13px;font-weight:700;background:var(--sun);color:var(--sunink);border-radius:6px;padding:2px 8px}
.line{display:flex;gap:8px;align-items:center;margin:8px 0}
.line input[type=text]{flex:1}
.line input[type=radio]{width:24px;height:24px;flex:none;accent-color:var(--ok)}
.line .n{width:24px;text-align:center;font-weight:700;color:var(--muted);flex:none}
.line .arrow{flex:none;color:var(--muted)}
.icon{width:40px;height:40px;flex:none;border-radius:10px;border:2px solid var(--line);background:var(--card);cursor:pointer;display:inline-grid;place-items:center;font-size:16px}
.icon:hover{border-color:var(--ink)}
.addbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px;border:2px dashed var(--line);border-radius:16px;margin:18px 0}
.err{color:var(--ko);font-weight:500;min-height:1.5em}
.hint{font-size:14px;color:var(--muted);margin:4px 0}
/* gioco */
.qhead{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.qhead .who{margin-left:auto;color:var(--muted);font-size:14px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;padding:16px 0 calc(14px + env(safe-area-inset-bottom));margin-top:2px;background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 0%,transparent),var(--bg) 40%)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;border:2px solid var(--sunink)}
.dot.ok{background:#12806b}.dot.ko{background:#c8381a}.dot.part{background:#c77d00}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(10,10,8,.72);display:grid;place-items:center;padding:16px}
.ovl .box{background:var(--card);border-radius:22px;padding:20px;width:min(560px,100%);max-height:100%;overflow:auto;text-align:center;border:3px solid var(--ink)}
.ovl img{width:min(100%,62vh);aspect-ratio:1;image-rendering:pixelated;background:#fff;border-radius:12px;display:block;margin:12px auto}
.ovl .url{font-size:14px;color:var(--muted);overflow-wrap:anywhere;margin:0 0 14px}
.passage{font-size:18px;line-height:2.15;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:16px 0;overflow-wrap:anywhere;hyphens:auto}
.gap{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:76px;min-height:34px;padding:1px 10px;margin:0 2px;border:2px dashed var(--muted);border-radius:10px;background:var(--soft);color:var(--ink);font:inherit;font-size:17px;line-height:1.25;vertical-align:middle;cursor:pointer;scroll-margin:110px 0 260px;max-width:100%;text-align:center}
.gap .gn{font-size:13px;font-weight:700;color:var(--muted)}
.gap.filled{border-style:solid;border-color:var(--ink);background:var(--card);font-weight:600}
.gap.active{border-style:solid;border-color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,var(--card));box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 28%,transparent)}
.gap.active .gn{color:var(--coral)}
.gap.ok{border:2px solid var(--ok);background:var(--okbg);color:var(--ok);font-weight:600;cursor:default}
.gap.ko{border:2px solid var(--ko);background:var(--kobg);cursor:default;flex-wrap:wrap}
.gap .wrong{color:var(--ko);font-weight:500}.gap .right{color:var(--ok)}
.bank{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;max-height:32vh;overflow:auto;padding:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;box-shadow:0 -6px 18px rgba(0,0,0,.06)}
.wchip{min-height:42px;padding:6px 14px;border-radius:999px;border:2px solid var(--sunink);background:var(--sun);color:var(--sunink);font-weight:600;font-size:16px;cursor:pointer;max-width:100%;overflow-wrap:anywhere;text-align:center;transition:transform .1s}
.wchip:active{transform:scale(.96)}
.wchip.used{opacity:.25;border-style:dashed;background:transparent;color:var(--ink);cursor:default}
.gprev{margin:8px 0 4px;line-height:2}.gprev .chip{display:inline-block;line-height:1.5}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 22px}
.progress i{display:block;height:100%;background:var(--coral);border-radius:99px;transition:width .3s}
.qtext{font-size:clamp(22px,3.6vw,30px);font-weight:700;line-height:1.2;margin:0 0 6px;text-wrap:balance}
.opts{display:grid;gap:10px;margin:18px 0}
.opt{display:flex;gap:12px;align-items:center;text-align:start;width:100%;min-height:58px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;font-size:17px;line-height:1.3;transition:border-color .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--c,var(--ink))}
.opt:active:not([disabled]){transform:scale(.99)}
.opt .let{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:color-mix(in srgb,var(--c,#888) 16%,var(--card));color:var(--c,var(--ink))}
.opt .t,.ord .txt,.mi .t{flex:1;overflow-wrap:anywhere;hyphens:auto}
.opt.sel{border-color:var(--c,var(--ink));box-shadow:inset 0 0 0 2px var(--c,var(--ink))}
.opt.sel .let{background:var(--c,var(--ink));color:#fff}
.mark{flex:none;font-weight:800;font-size:19px;width:28px;text-align:center}
.ok .mark{color:var(--ok)}.ko .mark{color:var(--ko)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .let{background:var(--ok);color:#fff}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.opt.ko .let{background:var(--ko);color:#fff}
.opt[disabled]{cursor:default}
.ord{list-style:none;padding:0;margin:18px 0;display:grid;gap:8px}
.ord li{display:flex;gap:8px;align-items:center;padding:6px 6px 6px 2px;border:2px solid var(--line);border-radius:14px;background:var(--card);min-height:60px;font-size:17px;line-height:1.3;user-select:none;-webkit-user-select:none}
.ord li.shift{transition:transform .15s ease}
.ord li.dragging{position:relative;z-index:3;border-color:var(--ink);box-shadow:0 12px 28px rgba(0,0,0,.22);transition:none}
.grip{flex:none;width:34px;align-self:stretch;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none}
.dragging .grip{cursor:grabbing}
.arrows{flex:none;display:flex;flex-direction:column;gap:4px}
.arr{width:42px;height:26px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.arr:hover:not([disabled]){border-color:var(--ink)}
.arr[disabled]{opacity:.3;cursor:default}
.ord li .pos{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sun);color:var(--sunink);display:grid;place-items:center;font-weight:800;font-size:15px}
.ord li .txt{flex:1}
.ord li.ok{border-color:var(--ok);background:var(--okbg)}
.ord li.ko{border-color:var(--ko);background:var(--kobg)}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px;margin:18px 0;align-items:stretch}
.match .colh{font-size:13px;color:var(--muted);font-weight:500;align-self:end}
.mi{display:flex;gap:8px;align-items:center;width:100%;height:100%;text-align:start;min-height:58px;padding:10px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;font-size:16px;line-height:1.3;transition:border-color .15s}
.mi:hover:not([disabled]){border-color:var(--ink)}
.mi .b{flex:none;width:28px;height:28px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
.mi.picked{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.mi.ok{border-color:var(--ok);background:var(--okbg)}
.mi.ko{border-color:var(--ko);background:var(--kobg)}
.mi[disabled]{cursor:default}
.fb{border-radius:14px;padding:12px 16px;margin:0;font-weight:500;flex-basis:100%;border:2px solid currentColor}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.ko{background:var(--kobg);color:var(--ko)}
.fb.part{background:var(--soft);border-color:#c77d00}
.sol{font-size:15px;margin:0 0 18px;padding-left:20px}
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;background:var(--sun);color:var(--sunink);border:3px solid var(--sunink);border-radius:22px;padding:22px;margin:0 0 26px}
.score .big{font-size:clamp(48px,11vw,84px);font-weight:800;line-height:1;white-space:nowrap}
.score .big small{font-size:.4em;font-weight:700}
.save{font-size:14px;margin-top:6px}
/* classifica */
.lb{width:100%;border-collapse:collapse;font-size:16px}
.lb th{font-size:13px;color:var(--muted);font-weight:500;text-align:start;padding:6px 8px;border-bottom:2px solid var(--line)}
.lb td{padding:10px 8px;border-bottom:1px solid var(--line)}
.lb .num{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
.lb tr.me td{background:var(--soft);font-weight:700}
.rk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-weight:800;background:var(--line)}
tr:nth-child(1) .rk{background:var(--sun);color:var(--sunink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi:first-child{background:var(--sun);border-color:var(--sunink);color:var(--sunink)}
.kv{font-size:clamp(26px,5vw,34px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.kl{font-size:13px;opacity:.8}
.qstats{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:16px}
.qs{padding-top:14px;border-top:1px solid var(--line)}
.qs:first-child{border-top:0;padding-top:4px}
.qs-h{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.qn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px}
.qs-t{flex:1;font-weight:500;line-height:1.35;padding-top:3px}
.qs-h .tag{flex:none;margin-top:2px}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.s-ok,.c-ok b{background:var(--ok)}.s-part{background:#d89a1c}.s-ko{background:var(--ko)}
.qs-n{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:14px}
.qs-n b{font-variant-numeric:tabular-nums;background:none}
.c-ok b{color:var(--ok)}.c-part b{color:#b7790f}.c-ko b{color:var(--ko)}.c-tot{color:var(--muted)}
.bars{display:grid;gap:10px;margin-top:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px;font-size:14px;align-items:center}
.bar .lab{grid-column:1/-1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar .v{text-align:end;font-variant-numeric:tabular-nums}
.copybox{width:100%;min-height:120px;font-size:13px;font-family:ui-monospace,monospace;margin-top:10px}
.spin{color:var(--muted);padding:40px 0;text-align:center}
.foot{text-align:center;color:var(--muted);font-size:14px;margin-top:36px}.foot a{color:inherit}
@media(max-width:600px){
 .hero{grid-template-columns:minmax(0,1fr)}
 .score{grid-template-columns:minmax(0,1fr);text-align:center}
 .lb{font-size:14px}.lb .hide-s{display:none}.lb td,.lb th{padding-inline:4px}.lb .rk{width:26px;height:26px}
 main{padding-top:18px}
 .top-in{padding:8px 14px;gap:6px 10px}.brand{font-size:17px;gap:8px}.brand svg{width:28px;height:28px}
 nav button{min-height:36px;padding:4px 12px;font-size:14px}
 .card{padding:14px}.qe{padding:12px}
 .qtext{font-size:21px}
 .opts{gap:8px}.opt{min-height:54px;font-size:16px;padding:10px 12px;gap:10px}.opt .let{width:32px;height:32px}
 .ord li{font-size:16px;min-height:56px}
 .match{gap:6px 8px}.mi{font-size:14.5px;padding:8px 7px;gap:6px;min-height:54px}.mi .b{width:24px;height:24px;font-size:12px}
 .actions .btn{flex:1}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.qs-h .tag{display:none}
 .passage{font-size:17px;padding:12px;line-height:2.2}.gap{font-size:16px;min-width:64px}.wchip{min-height:40px;font-size:15px;padding:5px 12px}
 .linkrow{flex-wrap:wrap}.linkrow input{min-width:100%}
}
@media(prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>
</head>

    const q = d.questions[i], N = `Domanda ${i + 1}: `, text = q.text.trim() || (q.type === 'gaps' ? 'Completa il testo con le parole giuste' : '');

      if (g.length > 20) return N + 'al massimo 20 parole da completare.';
      if (g.length + extra.length > 28) return N + 'troppe parole in totale: riduci le parole in più.';

}

const onField = e => {
  const t = e.target;
  if (t.dataset && t.dataset.path && draft) { if (t.type === 'radio' && !t.checked) return; setPath(t.dataset.path, t.type === 'checkbox' ? t.checked : t.value);
    const m = t.dataset.path.match(/^questions\.(\d+)\.passage$/); if (m) { const el = document.getElementById('gp-' + m[1]); if (el) el.innerHTML = gapPreview(t.value); } }
  if (t.id === 'nick' && game) game.nick = t.value;
};
document.addEventListener('input', onField);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.qr) { ui.qr = null; render(); } });

/* trascinamento per "metti in ordine" (mouse e dita) */
let drag = null;
document.addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip'); if (!g || !game || game.phase !== 'q') return;
  const li = g.closest('li'), items = [...li.parentElement.children], from = items.indexOf(li);
  drag = {li, items, from, to: from, y0: e.clientY, id: e.pointerId, rects: items.map(x => x.getBoundingClientRect())};
  items.forEach(x => x !== li && x.classList.add('shift')); li.classList.add('dragging');
  try { g.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const {li, items, from, rects} = drag, dy = e.clientY - drag.y0;
  li.style.transform = `translateY(${dy}px)`;
  const mid = rects[from].top + rects[from].height / 2 + dy;
  let to = from;
  rects.forEach((r, i) => { const c = r.top + r.height / 2; if (i < from && mid < c) to = Math.min(to, i); if (i > from && mid > c) to = Math.max(to, i); });
  drag.to = to;
  const h = rects[from].height + 8;
  items.forEach((x, i) => { if (i === from) return; const off = (from < to && i > from && i <= to) ? -h : (from > to && i < from && i >= to) ? h : 0; x.style.transform = off ? `translateY(${off}px)` : ''; });
});
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  const {from, to} = drag; drag = null;
  if (from !== to && game && game.s && game.s.arr) { const a = game.s.arr; const [x] = a.splice(from, 1); a.splice(to, 0, x); }
  render();
};
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
document.addEventListener('change', onField);

/* ---------- avvio ---------- */
if (!firebaseConfig || !firebaseConfig.apiKey || /INCOLLA/.test(firebaseConfig.apiKey)) { dbState = 'setup'; route(); }
else {
  const fbApp = initializeApp(firebaseConfig);
  fs = getFirestore(fbApp); auth = getAuth(fbApp);
  route();
  const timer = setTimeout(() => { if (!quizzesLoaded) { dbState = 'slow'; render(); } }, 10000);
  onSnapshot(collection(fs, 'quizzes'), s => {
    quizzes = s.docs.map(x => normQuiz(x.id, x.data())).sort((a, b) => b.createdAt - a.createdAt);
    quizzesLoaded = true; clearTimeout(timer); dbState = 'ready'; onData();
  }, e => { clearTimeout(timer); dbState = 'error'; dbErr = e && e.code === 'permission-denied' ? 'Accesso ai quiz negato: controlla le regole di Firestore (vedi LEGGIMI.md).' : 'Impossibile collegarsi al database.'; render(); });
  onAuthStateChanged(auth, u => {
    const was = isAdmin; isAdmin = !!u; adminEmail = u ? (u.email || '') : '';
    if (location.hash === '#admin' && isAdmin) { location.hash = ''; return; }
    if (was !== isAdmin) { if (!isAdmin && view.name === 'edit') { draft = null; view = {name:'home'}; } syncSubs(); render(); }
  });
}
</script>
</body>
</html>
